server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # SPA: cualquier ruta desconocida cae en index.html (React Router resuelve).
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Assets con hash en el nombre: cache largo.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
