# ======================================================
# Compose BASE — forma "production" (PRD).
#
# Imágenes construidas, código CONGELADO (sin bind-mount), API sin --reload,
# frontend servido estático por nginx. Todo parametrizado por env file
# (infra/.env.dev | infra/.env.prd), seleccionado por el launcher ./red.
#
# DEV agrega encima docker-compose.dev.yml (bind-mounts + hot reload).
# PRD usa SOLO este archivo.
#
# Aislamiento entre ambientes: COMPOSE_PROJECT_NAME namespacea contenedores
# Y volúmenes -> red_dev_pgdata vs red_prd_pgdata (bases físicamente separadas).
# ======================================================

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: ${COMPOSE_PROJECT_NAME:-red}_postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      # Controla si el init carga el seed demo (010). Ver infra/sql/00_init.sql.
      RED_SEED: ${RED_SEED:-0}
    ports:
      - "${PG_PORT}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./sql:/docker-entrypoint-initdb.d

  pgadmin:
    image: dpage/pgadmin4
    container_name: ${COMPOSE_PROJECT_NAME:-red}_pgadmin
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD}
    ports:
      - "${PGADMIN_PORT}:80"
    depends_on:
      - postgres

  api:
    build:
      context: ..
      dockerfile: backend/Dockerfile
    container_name: ${COMPOSE_PROJECT_NAME:-red}_api
    restart: always
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      DATABASE_URL_TEST: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}_test
      CORS_ORIGINS: ${CORS_ORIGINS}
      SESSION_COOKIE_NAME: ${SESSION_COOKIE_NAME}
    ports:
      - "${API_PORT}:8000"
    depends_on:
      - postgres

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL}
    container_name: ${COMPOSE_PROJECT_NAME:-red}_frontend
    restart: always
    ports:
      - "${FRONT_PORT}:80"
    depends_on:
      - api

volumes:
  pgdata:
